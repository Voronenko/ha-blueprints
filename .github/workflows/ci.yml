name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry venv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: yamllint
        run: make lint-yaml

      - name: HA semantic lint
        run: make lint-blueprint

      - name: Native HA check
        run: make lint-native

      - name: Tests (incl. native)
        run: make test-native
