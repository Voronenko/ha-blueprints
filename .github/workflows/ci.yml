name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Configure Poetry venv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-root --with dev

      - name: yamllint
        run: make lint-yaml

      - name: HA semantic lint
        run: make lint-blueprint

      - name: Native HA check
        run: make lint-native

      - name: Tests (incl. native)
        run: make test-native

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: junit-xml
          path: junit.xml
          if-no-files-found: error

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: pytest
          path: junit.xml
          reporter: java-junit
          fail-on-error: false
